<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock_paper_scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading">
        <h1>Rock Paper Scissor</h1>
    </div>
    <div class="choices">

        <button class="choice" value="rock">👊</button>        
        <button class="choice" value="paper" >✋</button>
        <button class="choice" value="scissor">✌️</button>

        <p>Start game by picking choice</p>
        <div class="reset-button">
        <button id="reset_button">reset button</button></div>

    </div>
   
    
    <script src="script.js"></script>
</body>
</html>
